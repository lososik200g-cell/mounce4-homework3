{% extends 'base.html' %}

{% block content %}
<h1 class="mb-4">Все публикации</h1>
<div class="row">
    {% for post in posts %}
    <div class="col-md-4 mb-3">
        <div class="card h-100 shadow-sm">
            <div class="card-body d-flex flex-column">
                <h5 class="card-title">{{ post.title }}</h5>
                <p class="card-text text-muted">{{ post.description|truncatewords:15 }}</p>
                {% if post.category %}
                    <span class="badge bg-primary mb-2 align-self-start">{{ post.category.title }}</span>
                {% endif %}
                <div class="mt-auto">
                    <a href="{% url 'post_detail' pk=post.pk %}" class="btn btn-sm btn-outline-dark">Читать далее</a>
                </div>
            </div>
        </div>
    </div>
    {% empty %}
        <p>Постов пока нет.</p>
    {% endfor %}
</div>
{% endblock %}
